<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>gosyujin.com</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
      line-height: 1.6;
      color: #24292e;
      background: #fff;
      overflow-wrap: anywhere;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 32px 16px;
    }
    h1 { margin: 0 0 24px; font-size: 2rem; }
    h2 { margin: 32px 0 8px; font-size: 1.4rem; border-bottom: 1px solid #e1e4e8; }
    ul { margin: 0; padding-left: 1.5em; }
    a { color: #0366d6; }

    /* タップでの反応を速くする(ダブルタップ拡大待ちを無くす) */
    a, button, input, select, textarea, label {
      touch-action: manipulation;
    }

    /* フォームが追加されても、フォーカス時に iOS Safari が拡大しないように 16px 以上にする */
    input, select, textarea {
      font-size: 16px;
      max-width: 100%;
    }

    /* PC: 余白を広めに取り、リンクは本文サイズのまま */
    @media (min-width: 768px) {
      main { padding: 64px 24px; }
    }

    /* スマホ: リンクを指で押しやすい高さ(約44px)にする */
    @media (max-width: 767px) {
      h1 { font-size: 1.6rem; }
      li a {
        display: inline-block;
        padding: 10px 0;
        min-height: 24px;
      }
    }
  </style>
</head>
<body>
<main>
<h1>gosyujin.com</h1>
<h2>Link</h2>
<ul>
  <li><a href="https://scrapbox.io/gosyujin/">Scrapbox</a></li>
  <li><a href="https://gosyujin.com/scrapbox-tycoon/">scrapbox-tycoon</a></li>
  <li><a href="https://gosyujin.com/hateb-tycoon/">hateb-tycoon</a></li>
  <li><a href="https://gosyujin.com/feed-tycoon/">feed-tycoon</a></li>
  <li><a href="https://gosyujin.com/line-on-map/">line-on-map</a></li>
</ul>

<h2>Archive</h2>
<ul>
  <li><a href="https://gosyujin.com/blog/">GitHub Pages</a></li>
  <li><a href="https://gosyujin.hatenablog.com/">はてな</a></li>
</ul>
</main>
</body>
</html>
